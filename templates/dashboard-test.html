<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Filtros SNIC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body class="bg-dark text-light p-4">

  <div class="container">
    <h1>🧪 Test carga de filtros</h1>
    <p>Si esto se cuelga, el problema está en <code>/filtros2</code>.</p>

    <div class="mb-3">
      <label>Provincia:</label>
      <select id="prov" class="form-select"></select>
    </div>

    <div class="mb-3">
      <label>Año:</label>
      <select id="anio" class="form-select"></select>
    </div>

    <div class="mb-3">
      <label>Delito:</label>
      <select id="delito" class="form-select"></select>
    </div>

    <button class="btn btn-primary" onclick="probarFiltros()">Cargar filtros</button>
  </div>

  <script>
  async function probarFiltros() {
    console.log("🔹 Solicitando /filtros2 ...");
    try {
      const res = await fetch("/filtros2");
      const data = await res.json();
      console.log("✅ Respuesta recibida:", data);

      const sel = (id, vals) => {
        const s = document.getElementById(id);
        s.innerHTML = vals.map(v => `<option>${v}</option>`).join('');
      };

      sel("prov", data.provincias || []);
      sel("anio", data.anio || []);
      sel("delito", data.codigo_delito_snic_nombre || []);

      alert("Filtros cargados correctamente ✅");
    } catch (err) {
      console.error("❌ Error al pedir /filtros2:", err);
      alert("Error al cargar filtros. Ver consola.");
    }
  }
  </script>

</body>
</html>
