<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar Contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #1e1e2f; color: #fff; }
    .card { background-color: #2e2e42; border: 1px solid #444; border-radius: 10px; }
    .form-control { background-color: #111425; color: #fff; border: 1px solid #555; }
    .btn-warning { font-weight: bold; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg p-4">
          <h4 class="text-center mb-4 text-warning">⚠️ Cambio Obligatorio de Contraseña</h4>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Nueva Contraseña</label>
              <input type="password" name="nueva_password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirmar Contraseña</label>
              <input type="password" name="confirmar_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Actualizar Contraseña</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
