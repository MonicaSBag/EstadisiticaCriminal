<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ABM Provincias SNIC</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #1e1e2f;
      color: #fff;
      padding: 30px;
    }
    .table-container {
      background: #2e2e42;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .table-container table {
      font-size: 0.9rem;
    }
    .table-container th, .table-container td {
      white-space: nowrap;
      padding: 8px 5px;
    }
    .custom-select, .btn {
      border-radius: 8px;
      font-weight: 500;
    }
    #grafico {
      background: #111425;
      border-radius: 10px;
      padding: 10px;
      margin-top: 30px;
    }
  </style>

</head>
<body>

  <div class="container">

    <h1 class="text-center mb-4">Filtro de Provincias SNIC</h1>

      <div class="mb-3 d-flex justify-content-end">
        <a href="/" class="btn btn-outline-light">Volver a inicio</a>
      </div>

    <!-- ✅ Filtros dentro de una card -->
    <div class="card p-4 shadow-lg bg-dark text-light">

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Provincia</label>
          <select id="provincia" class="form-select custom-select"></select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Año</label>
          <select id="anio" class="form-select custom-select"></select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Tipo de Delito</label>
          <select id="codigo_delito_snic_nombre" class="form-select custom-select"></select>
        </div>
      </div>

      <div class="d-flex gap-3 mt-4">
        <button class="btn btn-success w-50" onclick="aplicarFiltros()">Consultar</button>
        <button class="btn btn-primary w-50" onclick="descargarRegistro()">Descargar CSV</button>
      </div>

    </div>


    <!-- ✅ Tabla con estilo -->
    <!-- Tabla -->
<div class="table-container shadow">
  <div class="box table-responsive mb-4">
    <table class="table table-striped table-dark text-center" id="tabla">
      <thead>
        <tr>
          <th>Provincia</th>
          <th>Año</th>
          <th>Tipo Delito</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p>Total registros: <strong id="totalTabla">0</strong></p>
    <div id="paginacion" class="d-flex gap-2 mt-2"></div>
  </div>
</div>

    <!-- ✅ Gráfico Google Charts -->
    <h2 class="mt-5">Gráfico de delitos por provincia</h2>
    <div id="grafico" style="width: 100%; height: 400px;"></div>

  </div>

  <script>
    const API = {
      filtros: '/filtros2',
      filtrar: '/filtrar',
      estadisticas: '/estadisticas'
    };

    const CONFIG = {
      limite: 50,
      paginaActual: 1
    };

    async function cargarFiltros() {
      const res = await fetch(API.filtros);
      const data = await res.json();

      llenarSelect('provincia', data.provincias);
      llenarSelect('anio', data.anio);
      llenarSelect('codigo_delito_snic_nombre', data.codigo_delito_snic_nombre);
    }

    function llenarSelect(id, valores) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Todos</option>';
      valores.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    function descargarRegistro() {
      const tabla = document.getElementById("tabla");
      const csv = [];

      tabla.querySelectorAll("tr").forEach(fila => {
        const columnas = Array.from(fila.querySelectorAll("th, td"));
        const filaCSV = columnas.map(col => `"${col.innerText.replace(/"/g, '""')}"`);
        csv.push(filaCSV.join(","));
      });

      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "estadisticas_criminales.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function aplicarFiltros() {
      const filtros = {
        provincia: document.getElementById('provincia').value,
        anio: document.getElementById('anio').value,
        codigo_delito_snic_nombre: document.getElementById('codigo_delito_snic_nombre').value,
      };

      const res = await fetch(API.filtrar, {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filtros)
      });
      const data = await res.json();

      actualizarTabla(data.datos);
      drawChart(filtros);
    }

    function actualizarTabla(datos) {
      const tbody = document.querySelector("#tabla tbody");
      const inicio = (CONFIG.paginaActual - 1) * CONFIG.limite;
      const fin = inicio + CONFIG.limite;
      const datosPagina = datos.slice(inicio, fin);

      tbody.innerHTML = datosPagina.map(row => `
        <tr>
          <td>${row.provincia_nombre}</td>
          <td>${row.anio}</td>
          <td>${row.codigo_delito_snic_nombre}</td>
          <td>${row.cantidad_hechos}</td>
        </tr>
      `).join('');

      document.getElementById("totalTabla").innerText = datos.length;
      dibujarPaginacion(datos.length);
    }

    function dibujarPaginacion(totalRegistros) {
      const contenedor = document.getElementById("paginacion");
      const totalPaginas = Math.ceil(totalRegistros / CONFIG.limite);

      contenedor.innerHTML = '';
      for (let i = 1; i <= totalPaginas; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = `btn btn-sm ${i === CONFIG.paginaActual ? "btn-warning" : "btn-outline-light"}`;
        btn.onclick = () => {
          CONFIG.paginaActual = i;
          aplicarFiltros();
        };
        contenedor.appendChild(btn);
      }
    }

    async function drawChart(filtros = {}) {
      const res = await fetch(API.estadisticas, {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filtros)
      });
      const data = await res.json();

      const chartData = [['Tipo de delito', 'Cantidad']];
      data.forEach(obj => chartData.push([obj.codigo_delito_snic_nombre, obj.cantidad]));

      const dataTable = google.visualization.arrayToDataTable(chartData);
      const options = {
        title: 'Delitos por tipo',
        width: '100%',
        height: 400,
        backgroundColor: '#111425',
        legend: { textStyle: { color: '#fff' } },
        titleTextStyle: { color: '#fff' },
        hAxis: { textStyle: { color: '#fff' }, titleTextStyle: { color: '#fff' } },
        vAxis: { textStyle: { color: '#fff' }, titleTextStyle: { color: '#fff' } }
      };

      const chart = new google.visualization.ColumnChart(document.getElementById('grafico'));
      chart.draw(dataTable, options);
    }

    window.onload = cargarFiltros;
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(() => drawChart());
  </script>

</body>
</html>
