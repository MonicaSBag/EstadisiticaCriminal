<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ABM Provincias SNIC</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #1e1e2f;
      color: #fff;
      padding: 30px;
    }
    .table-container {
      background: #2e2e42;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .custom-select, .btn {
      border-radius: 8px;
      font-weight: 500;
    }
    #grafico {
      background: #111425;
      border-radius: 10px;
      padding: 10px;
      margin-top: 30px;
    }
  </style>

</head>
<body>

  <div class="container">

    <h1 class="text-center mb-4">Filtro de Provincias SNIC</h1>

    <!-- ✅ Filtros dentro de una card -->
    <div class="card p-4 shadow-lg bg-dark text-light">

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Provincia</label>
          <select id="provincia" class="form-select custom-select"></select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Año</label>
          <select id="anio" class="form-select custom-select"></select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Tipo de Delito</label>
          <select id="codigo_delito_snic_nombre" class="form-select custom-select"></select>
        </div>
      </div>

      <div class="d-flex gap-3 mt-4">
        <button class="btn btn-success w-50" onclick="aplicarFiltros()">Filtrar</button>
        <button class="btn btn-primary w-50" onclick="descargarRegistro()">Descargar CSV</button>
      </div>

    </div>

    <h3 class="mt-4">Total: <span id="total" class="text-warning fw-bold">0</span></h3>


    <!-- ✅ Tabla con estilo -->
    <div class="table-container shadow">
      <div class="table-responsive">
        <table class="table table-striped table-dark text-center" id="tabla">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ✅ Gráfico Google Charts -->
    <h2 class="mt-5">Gráfico de delitos por provincia</h2>
    <div id="grafico" style="width: 100%; height: 400px;"></div>

  </div>


  <!-- ✅ Script original SIN CAMBIOS DE LÓGICA -->
  <script>
    async function cargarFiltros() {
      const res = await fetch('http://127.0.0.1:5000/filtros2');
      const data = await res.json();

      const selProvincia = document.getElementById('provincia');
      const selAnio = document.getElementById('anio');
      const selDelito = document.getElementById('codigo_delito_snic_nombre');

      const llenarSelect = (select, valores) => {
        select.innerHTML = '<option value="">Todos</option>';
        valores.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });
      };

      llenarSelect(selProvincia, data.provincias);
      llenarSelect(selAnio, data.anio);
      llenarSelect(selDelito, data.codigo_delito_snic_nombre);
    }


    async function aplicarFiltros() {
      const filtros = {
        provincia: document.getElementById('provincia').value,
        anio: document.getElementById('anio').value,
        codigo_delito_snic_nombre: document.getElementById('codigo_delito_snic_nombre').value,
        };

      const res = await fetch('http://127.0.0.1:5000/filtrar', {
        method:"POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filtros)
      });
      const data = await res.json();

      document.getElementById('total').textContent = data.total;

      const tabla = document.getElementById('tabla');
      const thead = tabla.querySelector('thead');
      const tbody = tabla.querySelector('tbody');
      tbody.innerHTML = '';
      thead.innerHTML = '';

      if (data.datos.length > 0) {
        const cols = Object.keys(data.datos[0]);
        thead.innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
        data.datos.forEach(fila => {
          const tr = document.createElement('tr');
          tr.innerHTML = cols.map(c => `<td>${fila[c]}</td>`).join('');
          tbody.appendChild(tr);
        });
      }
      drawChart(filtros);
    }


    function descargarRegistro() {
      const tabla = document.getElementById("tabla");
      let csv = [];

    for (let fila of tabla.querySelectorAll("tr")) {
        let columnas = fila.querySelectorAll("th, td");
        let filaCSV = [];
        columnas.forEach(col => {
        let texto = col.innerText.replace(/"/g, '""');
          filaCSV.push(`"${texto}"`);
        });
        csv.push(filaCSV.join(","));
      }

    const csvString = csv.join("\n");
    const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", "registro_criminales.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }


    window.onload = cargarFiltros;
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(() => drawChart());

    async function drawChart(filtros = {}) {
      const res = await fetch('http://127.0.0.1:5000/estadisticas', {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filtros)
      });
      const data = await res.json();

      const chartData = [['Tipo de delito', 'Cantidad']];
      data.forEach(obj => {
        chartData.push([obj.codigo_delito_snic_nombre, obj['COUNT(*)']]);
      });

      const dataTable = google.visualization.arrayToDataTable(chartData);
      const options = {
        title: 'Delitos por tipo',
        width: '100%',
        height: 400
      };

      const chart = new google.visualization.ColumnChart(document.getElementById('grafico'));
      chart.draw(dataTable, options);
    }
  </script>

</body>
</html>
