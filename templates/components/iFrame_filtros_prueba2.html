<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas Delictivas SNIC</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Charts -->
    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        body { background: #1e1e2f; color: #fff; }
        .box { background: #2e2e42; padding:20px; border-radius:10px; }
        h1 { text-align:center; margin-bottom:25px; }
        #grafico { background: #fff; border-radius:10px; padding:10px; }
        .table-box {
            background: #2e2e42;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .table-box table {
            font-size: 0.9rem;
        }
        .table-box th, .table-box td {
            white-space: nowrap;
            padding: 8px 5px;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Estadísticas Delictivas - SNIC</h1>
        <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Cerrar Sesión</a>
    </div>

    <!-- FILTROS -->
    <div class="box mb-4">
        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Provincia</label>
                <select id="filtroProvincia" class="form-select">
                    <option value="">Todas</option>
                    {% for p in provincias %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Año</label>
                <select id="filtroAnio" class="form-select">
                    <option value="">Todos</option>
                    {% for a in anios %}
                    <option value="{{ a }}">{{ a }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Tipo Delito</label>
                <select id="filtroDelito" class="form-select">
                    <option value="">Todos</option>
                    {% for d in delitos %}
                    <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button class="btn btn-success w-50" onclick="aplicarFiltros()">Filtrar</button>
            <button class="btn btn-secondary w-50" onclick="limpiarFiltros()">Limpiar</button>
        </div>
    </div>

    <!-- BÚSQUEDA -->
    <div class="input-group mb-4 box">
        <span class="input-group-text">🔎</span>
        <input type="text" id="busqueda" class="form-control" placeholder="Buscar en tabla...">
    </div>

    <!-- TABLA -->
    <div class="table-box table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-striped table-dark text-center" id="tablaDelitos">
            <thead>
                <tr>
                    <th>Provincia</th>
                    <th>Año</th>
                    <th>Tipo Delito</th>
                    <th>Hechos</th>
                    <th>Víctimas</th>
                    <th>Víctimas Masc</th>
                    <th>Víctimas Fem</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <p>Total registros: <strong id="totalTabla">0</strong></p>
    </div>

    <!-- GRÁFICO -->
    <h2 class="text-center mb-3">Cantidad de delitos por tipo</h2>
    <div id="grafico" style="width:100%; height:450px;"></div>

</div>


<script>
// ✅ BÚSQUEDA
const tabla = document.querySelector("#tablaDelitos tbody");
document.getElementById("busqueda").addEventListener("keyup", function() {
    let filtro = this.value.toLowerCase();
    let filas = tabla.querySelectorAll("tr");
    filas.forEach(f =>
        f.style.display = f.innerText.toLowerCase().includes(filtro) ? "" : "none"
    );
});

// ✅ FILTROS → Actualiza tabla + gráfico
async function aplicarFiltros() {
    const filtros = {
        provincia: document.getElementById("filtroProvincia").value,
        anio: document.getElementById("filtroAnio").value,
        codigo_delito_snic_nombre: document.getElementById("filtroDelito").value
    };

    const res = await fetch("/filtrar", {
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(filtros)
    });

    const data = await res.json();
    actualizarTabla(data.datos);
    drawChart(filtros);
}

function limpiarFiltros() {
    document.getElementById("filtroProvincia").value = "";
    document.getElementById("filtroAnio").value = "";
    document.getElementById("filtroDelito").value = "";
    aplicarFiltros();
}

// ✅ TABLA REACTIVA
function actualizarTabla(datos) {
    tabla.innerHTML = "";
    datos.forEach(row =>{
        tabla.innerHTML += `
        <tr>
            <td>${row.provincia_nombre || ''}</td>
            <td>${row.anio || ''}</td>
            <td>${row.codigo_delito_snic_nombre || ''}</td>
            <td>${row.cantidad_hechos || 0}</td>
            <td>${row.cantidad_victimas || 0}</td>
            <td>${row.cantidad_victimas_masc || 0}</td>
            <td>${row.cantidad_victimas_fem || 0}</td>
        </tr>`;
    });
    document.getElementById("totalTabla").innerText = datos.length;
}

// ✅ GOOGLE CHART
async function drawChart(filtros = {}) {
    const res = await fetch("/estadisticas", {
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(filtros)
    });

    const data = await res.json();

    const chartData = [["Tipo Delito", "Cantidad"]];
    data.forEach(row =>
        chartData.push([row.codigo_delito_snic_nombre, row['COUNT(*)'] || 0])
    );

    const dataTable = google.visualization.arrayToDataTable(chartData);
    const chart = new google.visualization.ColumnChart(document.getElementById("grafico"));

    chart.draw(dataTable, {
        title: "Delitos por categoría",
        backgroundColor: "#ffffff",
        legend: { position: "bottom" }
    });
}

// ✅ CARGAR FILTROS DINÁMICAMENTE
async function cargarFiltros() {
    const res = await fetch('/filtros2');
    const data = await res.json();

    const selProvincia = document.getElementById('filtroProvincia');
    const selAnio = document.getElementById('filtroAnio');
    const selDelito = document.getElementById('filtroDelito');

    const llenarSelect = (select, valores) => {
        // Limpiar opciones excepto la primera
        while (select.options.length > 1) {
            select.remove(1);
        }
        valores.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
        });
    };

    llenarSelect(selProvincia, data.provincias);
    llenarSelect(selAnio, data.anio);
    llenarSelect(selDelito, data.codigo_delito_snic_nombre);
    
    // Cargar todos los registros al inicializar
    aplicarFiltros();
}

// ✅ INICIALIZAR
window.onload = () => {
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(cargarFiltros);
}
